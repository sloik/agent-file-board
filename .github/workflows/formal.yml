name: Formal models
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-models:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Require reviewed implementation/model alignment
        run: python3 formal/check_alignment.py
      - name: Test fail-closed runner
        run: python3 -m unittest discover -s formal -p "test_*.py"
      - name: Install signing dependencies and check mapped runtime behavior
        run: |
          python3 -m pip install -r requirements-signing.txt
          python3 -m unittest discover -s tests -p "test_signing_runtime.py"
      - name: Check observed private-save traces and implementation mutants
        run: python3 formal/check_traces.py
      - name: Check bounded signing and recovery models with mutation controls
        run: python3 formal/check.py
