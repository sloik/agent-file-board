name: Formal models
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # Monday 06:17 UTC
permissions:
  contents: read
jobs:
  prepare-formal-request:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          # Full history and tags: the regressions phase runs test_subthreads' compatibility
          # check against `git archive v3.3.1`, as the unit job (test.yml) already does.
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Preserve hosted phases and freeze complete Oracle campaigns
        env:
          AFB_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 formal/status.py --prepare-request .formal-request
      - name: Retain immutable request for trusted dispatcher
        uses: actions/upload-artifact@v7
        with:
          name: formal-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: .formal-request/request.json
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
      - name: Publish preparation summary (native verification pending)
        if: always()
        shell: bash
        run: |
          if [[ -f .formal-request/preparation-status/status.md ]]; then
            cat .formal-request/preparation-status/status.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Formal verification did not produce a report. Setup failed or the run was interrupted; no pass is established." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain preparation status
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: formal-preparation-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .formal-request/preparation-status/status.json
            .formal-request/preparation-status/status.md
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: warn
