name: Test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check syntax
        run: python -m py_compile boardctl.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check CONVENTION.md version format
        run: python boardctl.py release-check
      - name: Check release tag matches CONVENTION.md version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python boardctl.py release-check --tag "$GITHUB_REF_NAME"
